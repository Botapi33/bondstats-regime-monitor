<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bond Market Regime Monitor | BondStats</title>

  <style>
    :root {
      --bg: #050707;
      --bg-2: #0a0e0e;
      --panel: rgba(10, 15, 15, 0.82);
      --panel-2: rgba(12, 18, 18, 0.9);
      --line: rgba(90, 112, 108, 0.22);
      --line-strong: rgba(112, 148, 140, 0.34);

      --text: #eef4f1;
      --muted: #9aa8a2;
      --muted-2: #70807a;

      --green: #30d88a;
      --green-2: #1fbf78;
      --green-soft: rgba(48, 216, 138, 0.12);
      --green-glow: rgba(48, 216, 138, 0.22);

      --blue: #6ba7ff;
      --orange: #ff9a57;
      --red: #f06d6d;
      --white-soft: rgba(255,255,255,0.06);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(circle at top left, rgba(48, 216, 138, 0.10), transparent 28%),
        radial-gradient(circle at top right, rgba(48, 216, 138, 0.06), transparent 25%),
        linear-gradient(180deg, #060909 0%, #040606 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    body {
      padding: 26px 24px 34px;
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      position: relative;
    }

    .monitor-shell {
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(11, 16, 16, 0.94) 0%, rgba(7, 10, 10, 0.98) 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.015) inset,
        0 20px 60px rgba(0,0,0,0.35),
        0 0 30px rgba(48, 216, 138, 0.04);
      overflow: hidden;
      border-radius: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.015);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green-glow);
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--green);
      text-transform: uppercase;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .badge {
      padding: 7px 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      border-radius: 999px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 26px;
      padding: 26px 28px 28px;
      border-bottom: 1px solid var(--line);
    }

    .hero-left {
      min-width: 0;
    }

    .title {
      margin: 0;
      font-size: clamp(32px, 4vw, 54px);
      line-height: 1.02;
      letter-spacing: -0.04em;
      font-weight: 650;
    }

    .subtitle {
      margin-top: 14px;
      max-width: 760px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .hero-right {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-content: start;
    }

    .mini-panel {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(15,22,22,0.85), rgba(9,13,13,0.96));
      border-radius: 14px;
      padding: 15px 16px;
      min-height: 92px;
    }

    .mini-label {
      color: var(--muted-2);
      font-size: 10px;
      letter-spacing: 0.12em;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .mini-value {
      font-size: 15px;
      line-height: 1.4;
      font-weight: 600;
      color: var(--text);
    }

    .mini-sub {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .regime-band {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 0;
      border-bottom: 1px solid var(--line);
    }

    .regime-main {
      padding: 28px;
      border-right: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(48, 216, 138, 0.045), rgba(48, 216, 138, 0.01) 48%, transparent 100%);
    }

    .section-kicker {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.16em;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .regime-name {
      margin: 0;
      color: var(--green);
      font-size: clamp(34px, 4.5vw, 58px);
      line-height: 0.98;
      letter-spacing: -0.045em;
      font-weight: 680;
      text-transform: uppercase;
    }

    .regime-text {
      margin-top: 16px;
      max-width: 820px;
      color: #c2ccc7;
      font-size: 14px;
      line-height: 1.75;
    }

    .regime-side {
      padding: 28px;
      display: grid;
      gap: 12px;
      align-content: start;
      background: rgba(255,255,255,0.01);
    }

    .side-box {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 15px;
      background: rgba(255,255,255,0.015);
    }

    .side-box-label {
      color: var(--muted-2);
      font-size: 10px;
      letter-spacing: 0.12em;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .side-box-value {
      font-size: 18px;
      font-weight: 650;
      line-height: 1.2;
    }

    .side-box-sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .signals-wrap {
      padding: 0;
      border-bottom: 1px solid var(--line);
    }

    .signals-header {
      padding: 18px 28px 0;
    }

    .signals-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      margin-top: 14px;
    }

    .signal {
      padding: 20px 18px 18px;
      min-height: 170px;
      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.012), rgba(255,255,255,0.002));
    }

    .signal:last-child {
      border-right: 0;
    }

    .signal-rule {
      width: 28px;
      height: 2px;
      background: var(--green);
      margin-bottom: 16px;
      opacity: 0.95;
    }

    .signal:nth-child(2) .signal-rule { background: #83c9ff; }
    .signal:nth-child(3) .signal-rule { background: #dbe5df; }
    .signal:nth-child(4) .signal-rule { background: #ffad72; }
    .signal:nth-child(5) .signal-rule { background: #68e0ae; }

    .signal-title {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .signal-value {
      font-size: 20px;
      line-height: 1.2;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }

    .signal-detail {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .positive { color: var(--green); }
    .negative { color: var(--orange); }
    .neutral { color: var(--text); }

    .data-section {
      padding: 22px 28px 28px;
      border-bottom: 1px solid var(--line);
    }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .data-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 15px 13px;
      background: linear-gradient(180deg, rgba(255,255,255,0.018), rgba(255,255,255,0.006));
    }

    .data-label {
      min-height: 28px;
      color: var(--muted-2);
      font-size: 9px;
      line-height: 1.35;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .data-value {
      margin-top: 8px;
      font-size: 22px;
      line-height: 1.1;
      font-weight: 650;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .bottom {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 0;
    }

    .interpretation {
      padding: 28px;
      border-right: 1px solid var(--line);
    }

    .interpretation h3,
    .methodology h3 {
      margin: 0 0 10px 0;
      font-size: 22px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      font-weight: 650;
    }

    .interpretation p {
      margin: 0;
      color: #b8c2bd;
      font-size: 14px;
      line-height: 1.8;
      max-width: 760px;
    }

    .methodology {
      padding: 28px;
      background: rgba(255,255,255,0.012);
    }

    .method-list {
      margin-top: 12px;
      border-top: 1px solid var(--line);
    }

    .method-row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255,255,255,0.045);
      font-size: 12px;
    }

    .method-left {
      color: #dbe3df;
      font-weight: 500;
    }

    .method-right {
      color: var(--muted);
      text-align: right;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 28px 18px;
      border-top: 1px solid var(--line);
      color: var(--muted-2);
      font-size: 10px;
      line-height: 1.6;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: rgba(255,255,255,0.01);
    }

    .footer strong {
      color: #a7b2ad;
      font-weight: 600;
    }

    .loading {
      min-height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .error {
      max-width: 760px;
      margin: 80px auto;
      padding: 24px;
      border: 1px solid rgba(240, 109, 109, 0.28);
      border-radius: 14px;
      background: rgba(240, 109, 109, 0.05);
      color: #f0b0b0;
      font-size: 13px;
      line-height: 1.7;
    }

    @media (max-width: 1080px) {
      .hero,
      .regime-band,
      .bottom {
        grid-template-columns: 1fr;
      }

      .regime-main,
      .interpretation {
        border-right: 0;
      }

      .regime-main,
      .interpretation {
        border-bottom: 1px solid var(--line);
      }

      .signals-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .signal:nth-child(2n) {
        border-right: 0;
      }

      .signal:last-child {
        grid-column: 1 / -1;
      }

      .data-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 14px;
      }

      .topbar,
      .hero,
      .regime-main,
      .regime-side,
      .signals-header,
      .data-section,
      .interpretation,
      .methodology,
      .footer {
        padding-left: 16px;
        padding-right: 16px;
      }

      .topbar {
        display: block;
      }

      .topbar-right {
        margin-top: 10px;
        flex-wrap: wrap;
      }

      .signals-grid,
      .data-grid {
        grid-template-columns: 1fr;
      }

      .signal,
      .signal:nth-child(2n) {
        border-right: 0;
      }

      .signal:last-child {
        grid-column: auto;
      }

      .footer {
        display: block;
      }

      .footer div + div {
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="app" class="monitor-shell">
      <div class="loading">Loading fixed-income signals…</div>
    </div>
  </div>

  <script>
    const API_URL = "./data.json";

    function toneClass(tone) {
      if (tone === "positive") return "positive";
      if (tone === "negative") return "negative";
      return "neutral";
    }

    function pct(value) {
      if (value === null || value === undefined) return "—";
      return Number(value).toFixed(2) + "%";
    }

    function bp(value) {
      if (value === null || value === undefined) return "—";
      return Math.round(Number(value) * 100) + " bp";
    }

    function formatDate(date) {
      if (!date) return "—";
      const d = new Date(date + "T00:00:00");
      return d.toLocaleDateString("en-US", {
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }

    function render(data) {
      const s = data.signals;
      const r = data.raw;

      document.getElementById("app").innerHTML = `
        <div class="topbar">
          <div class="topbar-left">
            <div class="dot"></div>
            <div class="eyebrow">Fixed Income Analytics</div>
          </div>
          <div class="topbar-right">
            <div class="badge">BondStats Intelligence</div>
            <div class="badge">Rules-Based Model</div>
          </div>
        </div>

        <section class="hero">
          <div class="hero-left">
            <h1 class="title">Bond Market Regime Monitor</h1>
            <div class="subtitle">
              Track the market signals shaping growth, inflation, policy and financial conditions across fixed income. Built to show what the bond market is collectively pricing, not to imitate an AI forecast.
            </div>
          </div>

          <div class="hero-right">
            <div class="mini-panel">
              <div class="mini-label">Data Through</div>
              <div class="mini-value">${formatDate(data.asOf)}</div>
              <div class="mini-sub">Latest synchronized market data across rates, inflation and credit conditions.</div>
            </div>

            <div class="mini-panel">
              <div class="mini-label">Framework</div>
              <div class="mini-value">Policy · Curve · Real Rates · Credit · Inflation</div>
              <div class="mini-sub">Five transparent inputs. One market regime interpretation.</div>
            </div>
          </div>
        </section>

        <section class="regime-band">
          <div class="regime-main">
            <div class="section-kicker">Current Fixed-Income Regime</div>
            <h2 class="regime-name">${data.regime.name}</h2>
            <div class="regime-text">${data.regime.description}</div>
          </div>

          <div class="regime-side">
            <div class="side-box">
              <div class="side-box-label">Policy</div>
              <div class="side-box-value ${toneClass(s.policy.tone)}">${s.policy.label}</div>
              <div class="side-box-sub">${s.policy.detail}</div>
            </div>

            <div class="side-box">
              <div class="side-box-label">Credit Conditions</div>
              <div class="side-box-value ${toneClass(s.credit.tone)}">${s.credit.label}</div>
              <div class="side-box-sub">${s.credit.detail}</div>
            </div>

            <div class="side-box">
              <div class="side-box-label">Inflation Pricing</div>
              <div class="side-box-value ${toneClass(s.inflation.tone)}">${s.inflation.label}</div>
              <div class="side-box-sub">${s.inflation.detail}</div>
            </div>
          </div>
        </section>

        <section class="signals-wrap">
          <div class="signals-header">
            <div class="section-kicker">Signal Dashboard</div>
          </div>

          <div class="signals-grid">
            <div class="signal">
              <div class="signal-rule"></div>
              <div class="signal-title">Policy Expectations</div>
              <div class="signal-value ${toneClass(s.policy.tone)}">${s.policy.label}</div>
              <div class="signal-detail">2Y Treasury<br>${s.policy.detail}</div>
            </div>

            <div class="signal">
              <div class="signal-rule"></div>
              <div class="signal-title">Yield Curve</div>
              <div class="signal-value ${toneClass(s.curve.tone)}">${s.curve.label}</div>
              <div class="signal-detail">10Y − 2Y<br>${s.curve.detail}</div>
            </div>

            <div class="signal">
              <div class="signal-rule"></div>
              <div class="signal-title">Real Rates</div>
              <div class="signal-value ${toneClass(s.realRates.tone)}">${s.realRates.label}</div>
              <div class="signal-detail">10Y Real Yield<br>${s.realRates.detail}</div>
            </div>

            <div class="signal">
              <div class="signal-rule"></div>
              <div class="signal-title">Credit Conditions</div>
              <div class="signal-value ${toneClass(s.credit.tone)}">${s.credit.label}</div>
              <div class="signal-detail">Chicago Fed<br>${s.credit.detail}</div>
            </div>

            <div class="signal">
              <div class="signal-rule"></div>
              <div class="signal-title">Inflation Pricing</div>
              <div class="signal-value ${toneClass(s.inflation.tone)}">${s.inflation.label}</div>
              <div class="signal-detail">5Y Breakeven<br>${s.inflation.detail}</div>
            </div>
          </div>
        </section>

        <section class="data-section">
          <div class="section-kicker">Underlying Market Data</div>

          <div class="data-grid">
            <div class="data-card">
              <div class="data-label">2-Year Treasury</div>
              <div class="data-value">${pct(r.twoYear)}</div>
            </div>

            <div class="data-card">
              <div class="data-label">10-Year Treasury</div>
              <div class="data-value">${pct(r.tenYear)}</div>
            </div>

            <div class="data-card">
              <div class="data-label">2s10s Curve</div>
              <div class="data-value">${bp(r.curve)}</div>
            </div>

            <div class="data-card">
              <div class="data-label">10-Year Real Yield</div>
              <div class="data-value">${pct(r.realYield10Y)}</div>
            </div>

            <div class="data-card">
              <div class="data-label">Credit Subindex</div>
              <div class="data-value">${Number(r.creditIndex).toFixed(3)}</div>
            </div>

            <div class="data-card">
              <div class="data-label">5-Year Breakeven</div>
              <div class="data-value">${pct(r.breakeven5Y)}</div>
            </div>
          </div>
        </section>

        <section class="bottom">
          <div class="interpretation">
            <div class="section-kicker">Interpretation</div>
            <h3>${data.regime.name}</h3>
            <p>
              ${data.regime.description}
            </p>
          </div>

          <div class="methodology">
            <div class="section-kicker">Methodology</div>
            <h3>Signal Structure</h3>

            <div class="method-list">
              <div class="method-row">
                <span class="method-left">Policy</span>
                <span class="method-right">2Y Treasury trend</span>
              </div>
              <div class="method-row">
                <span class="method-left">Curve</span>
                <span class="method-right">10Y − 2Y</span>
              </div>
              <div class="method-row">
                <span class="method-left">Real Rates</span>
                <span class="method-right">10Y TIPS yield</span>
              </div>
              <div class="method-row">
                <span class="method-left">Credit</span>
                <span class="method-right">Chicago Fed Credit Subindex</span>
              </div>
              <div class="method-row">
                <span class="method-left">Inflation</span>
                <span class="method-right">5Y breakeven inflation</span>
              </div>
            </div>
          </div>
        </section>

        <footer class="footer">
          <div>Sources: <strong>Federal Reserve / FRED · Federal Reserve Bank of Chicago</strong></div>
          <div><strong>BondStats</strong> · Financial Intelligence Console Styling</div>
        </footer>
      `;
    }

    async function loadMonitor() {
      try {
        const response = await fetch(API_URL + "?v=" + Date.now(), {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Market data request failed.");
        }

        const data = await response.json();

        if (!data.ok) {
          throw new Error(data.error || data.message || "Market data unavailable.");
        }

        render(data);
      } catch (error) {
        document.getElementById("app").innerHTML = `
          <div class="error">
            <strong>Bond Market Regime Monitor</strong><br><br>
            Market data is temporarily unavailable.<br><br>
            ${error.message}
          </div>
        `;
      }
    }

    loadMonitor();
  </script>
</body>
</html>
