<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Bond Market Regime Monitor | BondStats</title>

<style>

:root {
  --bg: #040606;
  --bg-soft: #070a0a;
  --panel: #090d0c;

  --text: #f2f6f4;
  --muted: #89958f;
  --muted-2: #59645f;

  --line: rgba(120, 145, 135, 0.16);
  --line-strong: rgba(120, 145, 135, 0.28);

  --green: #2fd687;
  --green-bright: #5af2ab;
  --green-soft: rgba(47, 214, 135, 0.08);

  --blue: #72b7ff;
  --orange: #f1a45e;
  --red: #e26c6c;
  --white-soft: rgba(255,255,255,0.035);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background:
    radial-gradient(circle at 15% 0%, rgba(47,214,135,0.07), transparent 25%),
    linear-gradient(180deg, #050707 0%, #030505 100%);
  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Helvetica,
    Arial,
    sans-serif;
}

body {
  padding: 18px;
}

.shell {
  width: 100%;
  max-width: 1320px;
  margin: 0 auto;

  background:
    linear-gradient(180deg, rgba(10,14,13,0.96), rgba(5,8,7,0.985));

  border: 1px solid var(--line);
  border-radius: 18px;

  overflow: hidden;

  box-shadow:
    0 24px 80px rgba(0,0,0,0.38),
    0 0 40px rgba(47,214,135,0.035);
}

/* TOP BAR */

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;

  min-height: 48px;

  padding: 0 22px;

  border-bottom: 1px solid var(--line);

  background:
    linear-gradient(
      90deg,
      rgba(47,214,135,0.03),
      rgba(255,255,255,0.008)
    );
}

.brandline {
  display: flex;
  align-items: center;
  gap: 11px;
}

.live-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: var(--green);

  box-shadow:
    0 0 12px rgba(47,214,135,0.65);
}

.top-label {
  color: var(--green);

  font-size: 10px;
  font-weight: 700;

  letter-spacing: 0.19em;
  text-transform: uppercase;
}

.top-meta {
  display: flex;
  gap: 18px;

  color: var(--muted-2);

  font-size: 9px;

  text-transform: uppercase;
  letter-spacing: 0.12em;
}

/* HERO */

.hero {
  display: grid;

  grid-template-columns:
    minmax(0, 1.35fr)
    minmax(280px, 0.65fr);

  gap: 46px;

  padding: 34px 30px 32px;

  border-bottom:
    1px solid var(--line);
}

.hero-title {
  margin: 0;

  max-width: 760px;

  font-size:
    clamp(34px, 4.6vw, 60px);

  line-height: 0.98;

  letter-spacing: -0.045em;

  font-weight: 650;
}

.hero-subtitle {
  margin-top: 15px;

  max-width: 760px;

  color: var(--muted);

  font-size: 14px;
  line-height: 1.7;
}

.hero-right {
  display: flex;
  flex-direction: column;
  justify-content: space-between;

  gap: 24px;
}

.hero-meta-block {
  padding-top: 2px;
}

.hero-meta-label {
  color: var(--muted-2);

  font-size: 9px;
  font-weight: 700;

  text-transform: uppercase;
  letter-spacing: 0.15em;
}

.hero-meta-value {
  margin-top: 6px;

  font-size: 17px;
  line-height: 1.35;

  font-weight: 600;
}

.hero-meta-sub {
  margin-top: 5px;

  color: var(--muted);

  font-size: 11px;
  line-height: 1.5;
}

/* CURRENT REGIME */

.regime-section {
  position: relative;

  padding: 34px 30px 32px;

  border-bottom:
    1px solid var(--line);

  background:
    linear-gradient(
      90deg,
      rgba(47,214,135,0.055),
      rgba(47,214,135,0.01) 38%,
      transparent 72%
    );
}

.regime-section::before {
  content: "";

  position: absolute;

  top: 0;
  left: 0;

  width: 3px;
  height: 100%;

  background: var(--green);
}

.kicker {
  color: var(--muted);

  font-size: 9px;
  font-weight: 700;

  letter-spacing: 0.17em;
  text-transform: uppercase;

  margin-bottom: 12px;
}

.regime-name {
  margin: 0;

  color: var(--green-bright);

  font-size:
    clamp(34px, 5vw, 64px);

  line-height: 0.96;

  letter-spacing: -0.05em;

  font-weight: 650;
}

.regime-description {
  margin-top: 17px;

  max-width: 900px;

  color: #bcc7c1;

  font-size: 14px;
  line-height: 1.75;
}

/* SIGNALS */

.signal-section {
  border-bottom:
    1px solid var(--line);
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 18px 30px;

  border-bottom:
    1px solid var(--line);
}

.section-head-title {
  color: var(--text);

  font-size: 11px;
  font-weight: 650;

  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.section-head-note {
  color: var(--muted-2);

  font-size: 9px;

  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.signal-grid {
  display: grid;

  grid-template-columns:
    repeat(5, 1fr);
}

.signal {
  padding: 22px 20px 21px;

  min-height: 158px;

  border-right:
    1px solid var(--line);

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.012),
      transparent
    );
}

.signal:last-child {
  border-right: 0;
}

.signal-top {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin-bottom: 20px;
}

.signal-label {
  color: var(--muted);

  font-size: 9px;
  font-weight: 700;

  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.signal-index {
  color: var(--muted-2);

  font-size: 9px;

  font-variant-numeric:
    tabular-nums;
}

.signal-value {
  font-size: 21px;

  line-height: 1.15;

  letter-spacing: -0.025em;

  font-weight: 650;
}

.signal-detail {
  margin-top: 8px;

  color: var(--muted);

  font-size: 11px;
  line-height: 1.5;
}

.positive {
  color: var(--green);
}

.negative {
  color: var(--orange);
}

.neutral {
  color: var(--text);
}

/* MARKET STRIP */

.market-section {
  padding:
    22px 30px 26px;

  border-bottom:
    1px solid var(--line);
}

.market-strip {
  display: grid;

  grid-template-columns:
    repeat(6, 1fr);

  margin-top: 13px;

  border:
    1px solid var(--line);

  border-radius: 11px;

  overflow: hidden;
}

.market-cell {
  padding:
    15px
    15px
    14px;

  border-right:
    1px solid var(--line);

  background:
    rgba(255,255,255,0.01);
}

.market-cell:last-child {
  border-right: 0;
}

.market-label {
  min-height: 26px;

  color: var(--muted-2);

  font-size: 8px;

  line-height: 1.4;

  letter-spacing: 0.08em;
  text-transform: uppercase;

  font-weight: 700;
}

.market-value {
  margin-top: 7px;

  font-size: 20px;

  font-weight: 620;

  letter-spacing: -0.02em;

  font-variant-numeric:
    tabular-nums;
}

/* LOWER SECTION */

.lower {
  display: grid;

  grid-template-columns:
    1.2fr
    0.8fr;
}

.interpretation {
  padding: 28px 30px 30px;

  border-right:
    1px solid var(--line);
}

.methodology {
  padding: 28px 30px 30px;

  background:
    rgba(255,255,255,0.008);
}

.lower-title {
  margin: 0;

  font-size: 23px;

  line-height: 1.15;

  letter-spacing: -0.025em;

  font-weight: 630;
}

.lower-text {
  margin-top: 11px;

  max-width: 760px;

  color: #b5c0ba;

  font-size: 13px;

  line-height: 1.75;
}

.method-list {
  margin-top: 14px;

  border-top:
    1px solid var(--line);
}

.method-row {
  display: grid;

  grid-template-columns:
    1fr
    1.2fr;

  gap: 18px;

  padding: 10px 0;

  border-bottom:
    1px solid rgba(255,255,255,0.04);
}

.method-left {
  color: #d9e1dd;

  font-size: 11px;
}

.method-right {
  color: var(--muted);

  font-size: 11px;

  text-align: right;
}

/* FOOTER */

.footer {
  display: flex;

  justify-content: space-between;

  gap: 20px;

  padding:
    14px
    30px
    16px;

  border-top:
    1px solid var(--line);

  color: var(--muted-2);

  font-size: 9px;

  line-height: 1.6;

  text-transform: uppercase;

  letter-spacing: 0.07em;
}

.footer strong {
  color: #8f9d96;

  font-weight: 600;
}

/* STATES */

.loading {
  min-height: 520px;

  display: flex;

  align-items: center;
  justify-content: center;

  color: var(--muted);

  font-size: 11px;

  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.error {
  max-width: 760px;

  margin: 70px auto;

  padding: 24px;

  color: #efb3a6;

  border:
    1px solid
    rgba(226,108,108,0.25);

  border-radius: 12px;

  background:
    rgba(226,108,108,0.045);

  font-size: 13px;
  line-height: 1.7;
}

/* MOBILE */

@media (max-width: 1050px) {

  .hero {
    grid-template-columns: 1fr;
  }

  .hero-right {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .signal-grid {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .signal:nth-child(even) {
    border-right: 0;
  }

  .signal:last-child {
    grid-column: 1 / -1;
  }

  .market-strip {
    grid-template-columns:
      repeat(3, 1fr);
  }

  .market-cell:nth-child(3n) {
    border-right: 0;
  }

  .market-cell:nth-child(-n+3) {
    border-bottom:
      1px solid var(--line);
  }

  .lower {
    grid-template-columns: 1fr;
  }

  .interpretation {
    border-right: 0;

    border-bottom:
      1px solid var(--line);
  }
}

@media (max-width: 620px) {

  body {
    padding: 10px;
  }

  .shell {
    border-radius: 12px;
  }

  .topbar,
  .hero,
  .regime-section,
  .section-head,
  .market-section,
  .interpretation,
  .methodology,
  .footer {
    padding-left: 16px;
    padding-right: 16px;
  }

  .topbar {
    display: block;
    padding-top: 13px;
    padding-bottom: 13px;
  }

  .top-meta {
    margin-top: 10px;

    flex-wrap: wrap;
  }

  .hero-right {
    grid-template-columns: 1fr;
  }

  .signal-grid {
    grid-template-columns: 1fr;
  }

  .signal,
  .signal:nth-child(even) {
    border-right: 0;
  }

  .signal:last-child {
    grid-column: auto;
  }

  .market-strip {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .market-cell:nth-child(3n) {
    border-right:
      1px solid var(--line);
  }

  .market-cell:nth-child(even) {
    border-right: 0;
  }

  .market-cell {
    border-bottom:
      1px solid var(--line);
  }

  .market-cell:nth-last-child(-n+2) {
    border-bottom: 0;
  }

  .footer {
    display: block;
  }

  .footer div + div {
    margin-top: 7px;
  }
}

</style>
</head>

<body>

<div
  id="app"
  class="shell"
>
  <div class="loading">
    Loading market regime…
  </div>
</div>

<script>

const API_URL =
  "./data.json";

function toneClass(tone) {

  if (tone === "positive")
    return "positive";

  if (tone === "negative")
    return "negative";

  return "neutral";
}

function pct(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "—";
  }

  return Number(value)
    .toFixed(2) + "%";
}

function bp(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "—";
  }

  return Math.round(
    Number(value) * 100
  ) + " bp";
}

function formatDate(date) {

  if (!date)
    return "—";

  const d =
    new Date(
      date + "T00:00:00"
    );

  return d.toLocaleDateString(
    "en-US",
    {
      year: "numeric",
      month: "short",
      day: "numeric"
    }
  );
}

function render(data) {

  const s = data.signals;
  const r = data.raw;

  document.getElementById("app")
    .innerHTML = `

      <div class="topbar">

        <div class="brandline">

          <div class="live-dot"></div>

          <div class="top-label">
            BondStats Fixed Income Intelligence
          </div>

        </div>

        <div class="top-meta">

          <span>
            Live Market Framework
          </span>

          <span>
            Rules-Based Classification
          </span>

        </div>

      </div>


      <section class="hero">

        <div>

          <h1 class="hero-title">
            Bond Market Regime Monitor
          </h1>

          <div class="hero-subtitle">
            A compact view of the signals shaping
            policy expectations, the yield curve,
            real rates, credit conditions and
            inflation pricing across fixed income.
          </div>

        </div>


        <div class="hero-right">

          <div class="hero-meta-block">

            <div class="hero-meta-label">
              Data Through
            </div>

            <div class="hero-meta-value">
              ${formatDate(data.asOf)}
            </div>

            <div class="hero-meta-sub">
              Latest synchronized observation set.
            </div>

          </div>


          <div class="hero-meta-block">

            <div class="hero-meta-label">
              Regime Inputs
            </div>

            <div class="hero-meta-value">
              Five market signals
            </div>

            <div class="hero-meta-sub">
              Rates, curve, real yields,
              credit and inflation.
            </div>

          </div>

        </div>

      </section>


      <section class="regime-section">

        <div class="kicker">
          Current Fixed-Income Regime
        </div>

        <h2 class="regime-name">
          ${data.regime.name}
        </h2>

        <div class="regime-description">
          ${data.regime.description}
        </div>

      </section>


      <section class="signal-section">

        <div class="section-head">

          <div class="section-head-title">
            Market Signal Matrix
          </div>

          <div class="section-head-note">
            Direction · Level · Context
          </div>

        </div>


        <div class="signal-grid">

          <div class="signal">

            <div class="signal-top">

              <div class="signal-label">
                Policy Expectations
              </div>

              <div class="signal-index">
                01
              </div>

            </div>

            <div class="
              signal-value
              ${toneClass(
                s.policy.tone
              )}
            ">
              ${s.policy.label}
            </div>

            <div class="signal-detail">
              2-Year Treasury<br>
              ${s.policy.detail}
            </div>

          </div>


          <div class="signal">

            <div class="signal-top">

              <div class="signal-label">
                Yield Curve
              </div>

              <div class="signal-index">
                02
              </div>

            </div>

            <div class="
              signal-value
              ${toneClass(
                s.curve.tone
              )}
            ">
              ${s.curve.label}
            </div>

            <div class="signal-detail">
              10Y − 2Y<br>
              ${s.curve.detail}
            </div>

          </div>


          <div class="signal">

            <div class="signal-top">

              <div class="signal-label">
                Real Rates
              </div>

              <div class="signal-index">
                03
              </div>

            </div>

            <div class="
              signal-value
              ${toneClass(
                s.realRates.tone
              )}
            ">
              ${s.realRates.label}
            </div>

            <div class="signal-detail">
              10Y Real Yield<br>
              ${s.realRates.detail}
            </div>

          </div>


          <div class="signal">

            <div class="signal-top">

              <div class="signal-label">
                Credit Conditions
              </div>

              <div class="signal-index">
                04
              </div>

            </div>

            <div class="
              signal-value
              ${toneClass(
                s.credit.tone
              )}
            ">
              ${s.credit.label}
            </div>

            <div class="signal-detail">
              Chicago Fed Credit<br>
              ${s.credit.detail}
            </div>

          </div>


          <div class="signal">

            <div class="signal-top">

              <div class="signal-label">
                Inflation Pricing
              </div>

              <div class="signal-index">
                05
              </div>

            </div>

            <div class="
              signal-value
              ${toneClass(
                s.inflation.tone
              )}
            ">
              ${s.inflation.label}
            </div>

            <div class="signal-detail">
              5-Year Breakeven<br>
              ${s.inflation.detail}
            </div>

          </div>

        </div>

      </section>


      <section class="market-section">

        <div class="kicker">
          Underlying Market Data
        </div>

        <div class="market-strip">

          <div class="market-cell">

            <div class="market-label">
              2-Year Treasury
            </div>

            <div class="market-value">
              ${pct(r.twoYear)}
            </div>

          </div>


          <div class="market-cell">

            <div class="market-label">
              10-Year Treasury
            </div>

            <div class="market-value">
              ${pct(r.tenYear)}
            </div>

          </div>


          <div class="market-cell">

            <div class="market-label">
              2s10s Curve
            </div>

            <div class="market-value">
              ${bp(r.curve)}
            </div>

          </div>


          <div class="market-cell">

            <div class="market-label">
              10-Year Real Yield
            </div>

            <div class="market-value">
              ${pct(r.realYield10Y)}
            </div>

          </div>


          <div class="market-cell">

            <div class="market-label">
              Credit Subindex
            </div>

            <div class="market-value">
              ${
                Number(
                  r.creditIndex
                ).toFixed(3)
              }
            </div>

          </div>


          <div class="market-cell">

            <div class="market-label">
              5-Year Breakeven
            </div>

            <div class="market-value">
              ${pct(r.breakeven5Y)}
            </div>

          </div>

        </div>

      </section>


      <section class="lower">

        <div class="interpretation">

          <div class="kicker">
            Market Interpretation
          </div>

          <h3 class="lower-title">
            ${data.regime.name}
          </h3>

          <div class="lower-text">
            ${data.regime.description}
          </div>

        </div>


        <div class="methodology">

          <div class="kicker">
            Methodology
          </div>

          <h3 class="lower-title">
            Transparent Inputs
          </h3>

          <div class="method-list">

            <div class="method-row">

              <div class="method-left">
                Policy
              </div>

              <div class="method-right">
                2Y Treasury trend
              </div>

            </div>


            <div class="method-row">

              <div class="method-left">
                Curve
              </div>

              <div class="method-right">
                10Y − 2Y
              </div>

            </div>


            <div class="method-row">

              <div class="method-left">
                Real Rates
              </div>

              <div class="method-right">
                10Y TIPS yield
              </div>

            </div>


            <div class="method-row">

              <div class="method-left">
                Credit
              </div>

              <div class="method-right">
                Chicago Fed Credit Subindex
              </div>

            </div>


            <div class="method-row">

              <div class="method-left">
                Inflation
              </div>

              <div class="method-right">
                5Y breakeven inflation
              </div>

            </div>

          </div>

        </div>

      </section>


      <footer class="footer">

        <div>
          Sources:
          <strong>
            Federal Reserve / FRED ·
            Federal Reserve Bank of Chicago
          </strong>
        </div>

        <div>
          <strong>
            BondStats
          </strong>
          · Rules-Based Market Intelligence
        </div>

      </footer>

  `;
}

async function loadMonitor() {

  try {

    const response =
      await fetch(
        API_URL +
        "?v=" +
        Date.now(),
        {
          cache:
            "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "Market data request failed."
      );

    }

    const data =
      await response.json();

    if (!data.ok) {

      throw new Error(
        data.error ||
        data.message ||
        "Market data unavailable."
      );

    }

    render(data);

  } catch (error) {

    document.getElementById("app")
      .innerHTML = `

        <div class="error">

          <strong>
            Bond Market Regime Monitor
          </strong>

          <br><br>

          Market data is temporarily unavailable.

          <br><br>

          ${error.message}

        </div>

      `;

  }

}

loadMonitor();

</script>

</body>
</html>
