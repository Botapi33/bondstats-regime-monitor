<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Bond Market Regime Monitor | BondStats</title>

<style>

:root {
  --bg: #040606;
  --bg-soft: #070a0a;
  --panel: #090d0c;

  --text: #f2f6f4;
  --muted: #89958f;
  --muted-2: #59645f;

  --line: rgba(120, 145, 135, 0.16);
  --line-strong: rgba(120, 145, 135, 0.28);

  --green: #2fd687;
  --green-bright: #5af2ab;
  --green-soft: rgba(47, 214, 135, 0.08);

  --blue: #72b7ff;
  --orange: #f1a45e;
  --red: #e26c6c;
  --white-soft: rgba(255,255,255,0.035);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  max-width: 100%;

  overflow-x: hidden;

  background:
    radial-gradient(
      circle at 15% 0%,
      rgba(47,214,135,0.07),
      transparent 25%
    ),
    linear-gradient(
      180deg,
      #050707 0%,
      #030505 100%
    );

  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Helvetica,
    Arial,
    sans-serif;
}

body {
  padding: 18px;
}

.shell {
  width: 100%;
  max-width: 1320px;

  margin: 0 auto;

  min-width: 0;

  background:
    linear-gradient(
      180deg,
      rgba(10,14,13,0.96),
      rgba(5,8,7,0.985)
    );

  border: 1px solid var(--line);
  border-radius: 18px;

  overflow: hidden;

  box-shadow:
    0 24px 80px rgba(0,0,0,0.38),
    0 0 40px rgba(47,214,135,0.035);
}

/* TOP BAR */

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 20px;

  min-height: 48px;

  padding: 0 22px;

  border-bottom: 1px solid var(--line);

  background:
    linear-gradient(
      90deg,
      rgba(47,214,135,0.03),
      rgba(255,255,255,0.008)
    );
}

.brandline {
  display: flex;
  align-items: center;

  gap: 11px;

  min-width: 0;
}

.live-dot {
  width: 7px;
  height: 7px;

  flex: 0 0 auto;

  border-radius: 50%;

  background: var(--green);

  box-shadow:
    0 0 12px rgba(47,214,135,0.65);
}

.top-label {
  color: var(--green);

  font-size: 10px;
  font-weight: 700;

  letter-spacing: 0.19em;
  text-transform: uppercase;

  overflow-wrap: anywhere;
}

.top-meta {
  display: flex;
  gap: 18px;

  flex-wrap: wrap;

  justify-content: flex-end;

  min-width: 0;

  color: var(--muted-2);

  font-size: 9px;

  text-transform: uppercase;
  letter-spacing: 0.12em;
}

/* HERO */

.hero {
  display: grid;

  grid-template-columns:
    minmax(0, 1.35fr)
    minmax(280px, 0.65fr);

  gap: 46px;

  padding: 34px 30px 32px;

  border-bottom:
    1px solid var(--line);
}

.hero > * {
  min-width: 0;
}

.hero-title {
  margin: 0;

  max-width: 760px;

  font-size:
    clamp(34px, 4.6vw, 60px);

  line-height: 0.98;

  letter-spacing: -0.045em;

  font-weight: 650;

  overflow-wrap: break-word;
}

.hero-subtitle {
  margin-top: 15px;

  max-width: 760px;

  color: var(--muted);

  font-size: 14px;
  line-height: 1.7;

  overflow-wrap: anywhere;
}

.hero-right {
  display: flex;
  flex-direction: column;
  justify-content: space-between;

  gap: 24px;

  min-width: 0;
}

.hero-meta-block {
  padding-top: 2px;

  min-width: 0;
}

.hero-meta-label {
  color: var(--muted-2);

  font-size: 9px;
  font-weight: 700;

  text-transform: uppercase;
  letter-spacing: 0.15em;
}

.hero-meta-value {
  margin-top: 6px;

  font-size: 17px;
  line-height: 1.35;

  font-weight: 600;

  overflow-wrap: anywhere;
}

.hero-meta-sub {
  margin-top: 5px;

  color: var(--muted);

  font-size: 11px;
  line-height: 1.5;

  overflow-wrap: anywhere;
}

/* CURRENT REGIME */

.regime-section {
  position: relative;

  padding: 34px 30px 32px;

  border-bottom:
    1px solid var(--line);

  background:
    linear-gradient(
      90deg,
      rgba(47,214,135,0.055),
      rgba(47,214,135,0.01) 38%,
      transparent 72%
    );

  min-width: 0;
}

.regime-section::before {
  content: "";

  position: absolute;

  top: 0;
  left: 0;

  width: 3px;
  height: 100%;

  background: var(--green);
}

.kicker {
  color: var(--muted);

  font-size: 9px;
  font-weight: 700;

  letter-spacing: 0.17em;
  text-transform: uppercase;

  margin-bottom: 12px;
}

.regime-name {
  margin: 0;

  color: var(--green-bright);

  font-size:
    clamp(34px, 5vw, 64px);

  line-height: 0.96;

  letter-spacing: -0.05em;

  font-weight: 650;

  overflow-wrap: break-word;
}

.regime-description {
  margin-top: 17px;

  max-width: 900px;

  color: #bcc7c1;

  font-size: 14px;
  line-height: 1.75;

  overflow-wrap: anywhere;
}

/* SIGNALS */

.signal-section {
  border-bottom:
    1px solid var(--line);

  min-width: 0;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 18px;

  padding: 18px 30px;

  border-bottom:
    1px solid var(--line);
}

.section-head-title {
  color: var(--text);

  font-size: 11px;
  font-weight: 650;

  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.section-head-note {
  color: var(--muted-2);

  font-size: 9px;

  letter-spacing: 0.09em;
  text-transform: uppercase;

  text-align: right;
}

.signal-grid {
  display: grid;

  grid-template-columns:
    repeat(5, minmax(0, 1fr));

  min-width: 0;
}

.signal {
  padding: 22px 20px 21px;

  min-height: 158px;
  min-width: 0;

  border-right:
    1px solid var(--line);

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.012),
      transparent
    );
}

.signal:last-child {
  border-right: 0;
}

.signal-top {
  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 10px;

  margin-bottom: 20px;

  min-width: 0;
}

.signal-label {
  color: var(--muted);

  font-size: 9px;
  font-weight: 700;

  letter-spacing: 0.13em;
  text-transform: uppercase;

  min-width: 0;

  overflow-wrap: anywhere;
}

.signal-index {
  color: var(--muted-2);

  font-size: 9px;

  flex: 0 0 auto;

  font-variant-numeric:
    tabular-nums;
}

.signal-value {
  font-size: 21px;

  line-height: 1.15;

  letter-spacing: -0.025em;

  font-weight: 650;

  overflow-wrap: anywhere;
}

.signal-detail {
  margin-top: 8px;

  color: var(--muted);

  font-size: 11px;
  line-height: 1.5;

  overflow-wrap: anywhere;
}

.positive {
  color: var(--green);
}

.negative {
  color: var(--orange);
}

.neutral {
  color: var(--text);
}

/* MARKET STRIP */

.market-section {
  padding:
    22px 30px 26px;

  border-bottom:
    1px solid var(--line);

  min-width: 0;
}

.market-strip {
  display: grid;

  grid-template-columns:
    repeat(6, minmax(0, 1fr));

  margin-top: 13px;

  border:
    1px solid var(--line);

  border-radius: 11px;

  overflow: hidden;

  min-width: 0;
}

.market-cell {
  padding:
    15px
    15px
    14px;

  min-width: 0;

  border-right:
    1px solid var(--line);

  background:
    rgba(255,255,255,0.01);
}

.market-cell:last-child {
  border-right: 0;
}

.market-label {
  min-height: 26px;

  color: var(--muted-2);

  font-size: 8px;

  line-height: 1.4;

  letter-spacing: 0.08em;
  text-transform: uppercase;

  font-weight: 700;

  overflow-wrap: anywhere;
}

.market-value {
  margin-top: 7px;

  font-size: 20px;

  font-weight: 620;

  letter-spacing: -0.02em;

  font-variant-numeric:
    tabular-nums;

  overflow-wrap: anywhere;
}

/* LOWER SECTION */

.lower {
  display: grid;

  grid-template-columns:
    minmax(0, 1.2fr)
    minmax(0, 0.8fr);

  min-width: 0;
}

.interpretation {
  padding: 28px 30px 30px;

  border-right:
    1px solid var(--line);

  min-width: 0;
}

.methodology {
  padding: 28px 30px 30px;

  background:
    rgba(255,255,255,0.008);

  min-width: 0;
}

.lower-title {
  margin: 0;

  font-size: 23px;

  line-height: 1.15;

  letter-spacing: -0.025em;

  font-weight: 630;

  overflow-wrap: anywhere;
}

.lower-text {
  margin-top: 11px;

  max-width: 760px;

  color: #b5c0ba;

  font-size: 13px;

  line-height: 1.75;

  overflow-wrap: anywhere;
}

.method-list {
  margin-top: 14px;

  border-top:
    1px solid var(--line);

  min-width: 0;
}

.method-row {
  display: grid;

  grid-template-columns:
    minmax(0, 0.8fr)
    minmax(0, 1.2fr);

  gap: 18px;

  padding: 10px 0;

  border-bottom:
    1px solid rgba(255,255,255,0.04);

  min-width: 0;
}

.method-left {
  color: #d9e1dd;

  font-size: 11px;

  min-width: 0;

  overflow-wrap: anywhere;
}

.method-right {
  color: var(--muted);

  font-size: 11px;

  text-align: right;

  min-width: 0;

  overflow-wrap: anywhere;
}

/* FOOTER */

.footer {
  display: flex;

  justify-content: space-between;

  gap: 20px;

  padding:
    14px
    30px
    16px;

  border-top:
    1px solid var(--line);

  color: var(--muted-2);

  font-size: 9px;

  line-height: 1.6;

  text-transform: uppercase;

  letter-spacing: 0.07em;

  min-width: 0;
}

.footer > div {
  min-width: 0;

  overflow-wrap: anywhere;
}

.footer strong {
  color: #8f9d96;

  font-weight: 600;
}

/* STATES */

.loading {
  min-height: 520px;

  display: flex;

  align-items: center;
  justify-content: center;

  color: var(--muted);

  font-size: 11px;

  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.error {
  max-width: 760px;

  margin: 70px auto;

  padding: 24px;

  color: #efb3a6;

  border:
    1px solid
    rgba(226,108,108,0.25);

  border-radius: 12px;

  background:
    rgba(226,108,108,0.045);

  font-size: 13px;
  line-height: 1.7;

  overflow-wrap: anywhere;
}

/* RESPONSIVE */

@media (max-width: 1050px) {

  .hero {
    grid-template-columns: 1fr;
  }

  .hero-right {
    display: grid;

    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

  .signal-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

  .signal {
    border-bottom:
      1px solid var(--line);
  }

  .signal:nth-child(even) {
    border-right: 0;
  }

  .signal:last-child {
    grid-column: 1 / -1;

    border-bottom: 0;
  }

  .market-strip {
    grid-template-columns:
      repeat(3, minmax(0, 1fr));
  }

  .market-cell {
    border-bottom:
      1px solid var(--line);
  }

  .market-cell:nth-child(3n) {
    border-right: 0;
  }

  .market-cell:nth-last-child(-n+3) {
    border-bottom: 0;
  }

  .lower {
    grid-template-columns: 1fr;
  }

  .interpretation {
    border-right: 0;

    border-bottom:
      1px solid var(--line);
  }

}

@media (max-width: 620px) {

  body {
    padding: 10px;
  }

  .shell {
    border-radius: 12px;
  }

  .topbar,
  .hero,
  .regime-section,
  .section-head,
  .market-section,
  .interpretation,
  .methodology,
  .footer {
    padding-left: 16px;
    padding-right: 16px;
  }

  .topbar {
    display: block;

    padding-top: 13px;
    padding-bottom: 13px;
  }

  .top-meta {
    margin-top: 10px;

    justify-content: flex-start;
  }

  .hero-right {
    grid-template-columns: 1fr;
  }

  .section-head {
    display: block;
  }

  .section-head-note {
    margin-top: 8px;

    text-align: left;
  }

  .signal-grid {
    grid-template-columns: 1fr;
  }

  .signal,
  .signal:nth-child(even) {
    border-right: 0;

    border-bottom:
      1px solid var(--line);
  }

  .signal:last-child {
    grid-column: auto;

    border-bottom: 0;
  }

  .market-strip {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

  .market-cell,
  .market-cell:nth-child(3n) {
    border-right:
      1px solid var(--line);

    border-bottom:
      1px solid var(--line);
  }

  .market-cell:nth-child(even) {
    border-right: 0;
  }

  .market-cell:nth-last-child(-n+2) {
    border-bottom: 0;
  }

  .method-row {
    grid-template-columns:
      minmax(0, 0.7fr)
      minmax(0, 1.3fr);

    gap: 12px;
  }

  .footer {
    display: block;
  }

  .footer div + div {
    margin-top: 7px;
  }

}

</style>
</head>

<body>

<div id="app" class="shell">

  <div class="loading">
    Loading market regime…
  </div>

</div>


<script>

const API_URL = "./data.json";


function toneClass(tone) {

  if (tone === "positive") {
    return "positive";
  }

  if (tone === "negative") {
    return "negative";
  }

  return "neutral";
}


function safeNumber(value) {

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : null;
}


function pct(value) {

  const n =
    safeNumber(value);

  if (n === null) {
    return "—";
  }

  return n.toFixed(2) + "%";
}


function bp(value) {

  const n =
    safeNumber(value);

  if (n === null) {
    return "—";
  }

  return Math.round(
    n * 100
  ) + " bp";
}


function fixed(value, decimals = 3) {

  const n =
    safeNumber(value);

  if (n === null) {
    return "—";
  }

  return n.toFixed(decimals);
}


function safeText(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "—";
  }

  return String(value);
}


function formatDate(date) {

  if (!date) {
    return "—";
  }

  const d =
    new Date(
      date + "T00:00:00"
    );

  if (
    Number.isNaN(
      d.getTime()
    )
  ) {
    return safeText(date);
  }

  return d.toLocaleDateString(
    "en-US",
    {
      year: "numeric",
      month: "short",
      day: "numeric"
    }
  );
}


function render(data) {

  const s =
    data.signals || {};

  const r =
    data.raw || {};

  const policy =
    s.policy || {};

  const curve =
    s.curve || {};

  const realRates =
    s.realRates || {};

  const credit =
    s.credit || {};

  const inflation =
    s.inflation || {};

  const regime =
    data.regime || {};


  document
    .getElementById("app")
    .innerHTML = `


      <div class="topbar">

        <div class="brandline">

          <div class="live-dot"></div>

          <div class="top-label">
            BondStats Fixed Income Intelligence
          </div>

        </div>


        <div class="top-meta">

          <span>
            Live Market Framework
          </span>

          <span>
            Rules-Based Classification
          </span>

        </div>

      </div>


      <section class="hero">

        <div>

          <h1 class="hero-title">
            Bond Market Regime Monitor
          </h1>

          <div class="hero-subtitle">
            A compact view of the signals shaping
            policy expectations, the yield curve,
            real rates, credit conditions and
            inflation pricing across fixed income.
          </div>

        </div>


        <div class="hero-right">

          <div class="hero-meta-block">

            <div class="hero-meta-label">
              Data Through
            </div>

            <div class="hero-meta-value">
              ${formatDate(data.asOf)}
            </div>

            <div class="hero-meta-sub">
              Latest synchronized observation set.
            </div>

          </div>


          <div class="hero-meta-block">

            <div class="hero-meta-label">
              Regime Inputs
            </div>

            <div class="hero-meta-value">
              Five market signals
            </div>

            <div class="hero-meta-sub">
              Rates, curve, real yields,
              credit and inflation.
            </div>

          </div>

        </div>

      </section>


      <section class="regime-section">

        <div class="kicker">
          Current Fixed-Income Regime
        </div>

        <h2 class="regime-name">
          ${safeText(regime.name)}
        </h2>

        <div class="regime-description">
          ${safeText(regime.description)}
        </div>

      </section>


      <section class="signal-section">

        <div class="section-head">

          <div class="section-head-title">
            Market Signal Matrix
          </div>

          <div class="section-head-note">
            Direction · Level · Context
          </div>

        </div>


        <div class="signal-grid">


          <div class="signal">

            <div class="signal-top">

              <div class="signal-label">
                Policy Expectations
              </div>

              <div class="signal-index">
                01
              </div>

            </div>

            <div class="
              signal-value
              ${toneClass(policy.tone)}
            ">
              ${safeText(policy.label)}
            </div>

            <div class="signal-detail">
              2-Year Treasury<br>
              ${safeText(policy.detail)}
            </div>

          </div>


          <div class="signal">

            <div class="signal-top">

              <div class="signal-label">
                Yield Curve
              </div>

              <div class="signal-index">
                02
              </div>

            </div>

            <div class="
              signal-value
              ${toneClass(curve.tone)}
            ">
              ${safeText(curve.label)}
            </div>

            <div class="signal-detail">
              10Y − 2Y<br>
              ${safeText(curve.detail)}
            </div>

          </div>


          <div class="signal">

            <div class="signal-top">

              <div class="signal-label">
                Real Rates
              </div>

              <div class="signal-index">
                03
              </div>

            </div>

            <div class="
              signal-value
              ${toneClass(realRates.tone)}
            ">
              ${safeText(realRates.label)}
            </div>

            <div class="signal-detail">
              10Y Real Yield<br>
              ${safeText(realRates.detail)}
            </div>

          </div>


          <div class="signal">

            <div class="signal-top">

              <div class="signal-label">
                Credit Conditions
              </div>

              <div class="signal-index">
                04
              </div>

            </div>

            <div class="
              signal-value
              ${toneClass(credit.tone)}
            ">
              ${safeText(credit.label)}
            </div>

            <div class="signal-detail">
              Chicago Fed Credit<br>
              ${safeText(credit.detail)}
            </div>

          </div>


          <div class="signal">

            <div class="signal-top">

              <div class="signal-label">
                Inflation Pricing
              </div>

              <div class="signal-index">
                05
              </div>

            </div>

            <div class="
              signal-value
              ${toneClass(inflation.tone)}
            ">
              ${safeText(inflation.label)}
            </div>

            <div class="signal-detail">
              5-Year Breakeven<br>
              ${safeText(inflation.detail)}
            </div>

          </div>


        </div>

      </section>


      <section class="market-section">

        <div class="kicker">
          Underlying Market Data
        </div>


        <div class="market-strip">


          <div class="market-cell">

            <div class="market-label">
              2-Year Treasury
            </div>

            <div class="market-value">
              ${pct(r.twoYear)}
            </div>

          </div>


          <div class="market-cell">

            <div class="market-label">
              10-Year Treasury
            </div>

            <div class="market-value">
              ${pct(r.tenYear)}
            </div>

          </div>


          <div class="market-cell">

            <div class="market-label">
              2s10s Curve
            </div>

            <div class="market-value">
              ${bp(r.curve)}
            </div>

          </div>


          <div class="market-cell">

            <div class="market-label">
              10-Year Real Yield
            </div>

            <div class="market-value">
              ${pct(r.realYield10Y)}
            </div>

          </div>


          <div class="market-cell">

            <div class="market-label">
              Credit Subindex
            </div>

            <div class="market-value">
              ${fixed(r.creditIndex, 3)}
            </div>

          </div>


          <div class="market-cell">

            <div class="market-label">
              5-Year Breakeven
            </div>

            <div class="market-value">
              ${pct(r.breakeven5Y)}
            </div>

          </div>


        </div>

      </section>


      <section class="lower">


        <div class="interpretation">

          <div class="kicker">
            Market Interpretation
          </div>

          <h3 class="lower-title">
            ${safeText(regime.name)}
          </h3>

async function loadMonitor() {

  try {

    const response =
      await fetch(
        API_URL +
        "?v=" +
        Date.now(),
        {
          cache:
            "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Market data request failed."
      );

    }


    const data =
      await response.json();


    if (!data || !data.ok) {

      throw new Error(
        data?.error ||
        data?.message ||
        "Market data unavailable."
      );

    }


    render(data);


  } catch (error) {


    document
      .getElementById("app")
      .innerHTML = `

        <div class="error">

          <strong>
            Bond Market Regime Monitor
          </strong>

          <br><br>

          Market data is temporarily unavailable.

          <br><br>

          ${
            error?.message ||
            "Unknown error."
          }

        </div>

      `;

  }

}


loadMonitor();

</script>
